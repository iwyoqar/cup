<!doctype html>
<!--
  CUP <-> Poster: the page Poster opens for the CUP application ("Подключить" / Manage Platform). DEVELOPMENT entry point.
  It is a plain static page: no build step, no framework, no network calls, and NO secret of any kind (the application secret never belongs in a browser).
  Poster opens it as  /?poster_url=<account>&account_number=<id>&lang=<code>  (and, per Poster's Manage Platform docs, may append ?code=...).
  Those parameters come from the query string, so every one of them is validated and shown with textContent only (never innerHTML). A `code` is ignored and
  removed from the address bar; exchanging it needs the application secret, which is a server-side job that this page deliberately does not do.
  The page is meant to be shown inside Poster's management console iframe, so it must stay frameable (no X-Frame-Options / frame-ancestors), and it removes
  Poster's loading spinner as Poster's docs require. This is NOT the POS widget (that is dist/bundle.js) and NOT the CUP API.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>CUP Coffee — Poster</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --black: #0b0b0b; --terracotta: #d84b1f; --cream: #f6ddb0; --muted: #6f6a63; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #faf7f2; color: var(--black); }
      header { background: var(--black); color: var(--cream); padding: 14px 20px; font-weight: 800; letter-spacing: 0.18em; }
      main { max-width: 560px; margin: 0 auto; padding: 24px 20px 40px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      p { line-height: 1.45; margin: 8px 0; }
      .muted { color: var(--muted); font-size: 14px; }
      .card { background: #fff; border: 1px solid rgba(11, 11, 11, 0.14); border-radius: 12px; padding: 14px 16px; margin: 16px 0; }
      .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(11, 11, 11, 0.08); }
      .row:last-child { border-bottom: 0; }
      .k { color: var(--muted); }
      .v { font-weight: 600; overflow-wrap: anywhere; text-align: right; }
      .warn { border-left: 4px solid var(--terracotta); background: var(--cream); }
      ol { padding-left: 20px; margin: 8px 0; }
      li { margin: 4px 0; }
      code { background: rgba(11, 11, 11, 0.07); border-radius: 4px; padding: 1px 5px; }
    </style>
  </head>
  <body>
    <header>CUP</header>
    <main>
      <h1 id="title"></h1>
      <p class="muted" id="lead"></p>
      <div class="card" id="params"></div>
      <div class="card warn" id="note" hidden></div>
      <div class="card">
        <strong id="stepsTitle"></strong>
        <ol id="steps"></ol>
      </div>
      <p class="muted" id="footer"></p>
    </main>
    <script>
      (function () {
        // ---- what Poster sent, strictly validated (anything else is shown as "not valid", never echoed as markup) -------------------------------------------
        var q = new URLSearchParams(location.search);
        var pick = function (name, re) {
          var v = q.get(name);
          return v !== null && re.test(v) ? v : null;
        };
        var account = pick('poster_url', /^[a-z0-9][a-z0-9-]{0,62}(\.joinposter\.com)?$/i);
        var accountNumber = pick('account_number', /^\d{1,12}$/);
        var lang = pick('lang', /^[a-z]{2}(-[A-Za-z]{2})?$/);
        var sawAny = q.has('poster_url') || q.has('account_number') || q.has('lang');
        var hadCode = q.has('code');

        // ---- language: Poster's `lang`; Uzbek, Russian, English are written out, anything else falls back to English ------------------------------------------
        var code = (lang || 'ru').slice(0, 2).toLowerCase();
        var L = code === 'uz' ? 'uz' : code === 'ru' || code === 'uk' || code === 'kk' || code === 'be' ? 'ru' : 'en';
        var T = {
          uz: {
            title: 'CUP ilovasi Poster bilan',
            lead: 'Poster shu sahifani ochdi. Bu sahifa faqat ma’lumot beradi: hech narsani o‘zgartirmaydi va hech qayerga so‘rov yubormaydi.',
            account: 'Poster hisobi', number: 'Hisob raqami', language: 'Til', invalid: 'noto‘g‘ri qiymat', none: 'ko‘rsatilmagan',
            missing: 'Poster parametrlari (poster_url, account_number, lang) topilmadi. Sahifa to‘g‘ridan-to‘g‘ri ochilgan bo‘lishi mumkin.',
            codeNote: 'Poster avtorizatsiya kodini (code) yubordi. Bu sahifa uni ishlatmaydi va manzil satridan olib tashladi.',
            stepsTitle: 'Kassada CUP vidjetini sinash',
            steps: ['Kassa (POS) ni oching: <account>.joinposter.com/pos', 'Yuqoridagi </> tugmasini bosing va Development rejimini yoqing', 'Buyurtma oching, mijozni qo‘shing va ••• menyusidan CUP ni tanlang'],
            footer: 'CUP Coffee · faqat ishlab chiqish (development) uchun'
          },
          ru: {
            title: 'Приложение CUP в Poster',
            lead: 'Poster открыл эту страницу. Она только показывает данные: ничего не меняет и никуда не отправляет запросов.',
            account: 'Аккаунт Poster', number: 'Номер аккаунта', language: 'Язык', invalid: 'недопустимое значение', none: 'не передано',
            missing: 'Параметры Poster (poster_url, account_number, lang) не найдены. Возможно, страница открыта напрямую.',
            codeNote: 'Poster передал код авторизации (code). Эта страница его не использует и убрала из адресной строки.',
            stepsTitle: 'Проверка виджета CUP на кассе',
            steps: ['Откройте кассу: <account>.joinposter.com/pos', 'Нажмите </> вверху и включите режим Development', 'Откройте заказ, добавьте гостя и выберите CUP в меню •••'],
            footer: 'CUP Coffee · только для разработки (development)'
          },
          en: {
            title: 'CUP application in Poster',
            lead: 'Poster opened this page. It only displays information: it changes nothing and makes no requests.',
            account: 'Poster account', number: 'Account number', language: 'Language', invalid: 'not a valid value', none: 'not provided',
            missing: 'The Poster parameters (poster_url, account_number, lang) were not found. The page may have been opened directly.',
            codeNote: 'Poster sent an authorization code (code). This page does not use it and removed it from the address bar.',
            stepsTitle: 'Trying the CUP widget on the register',
            steps: ['Open the register: <account>.joinposter.com/pos', 'Press </> at the top and switch to Development mode', 'Open an order, add a guest and choose CUP in the ••• menu'],
            footer: 'CUP Coffee · development only'
          }
        }[L];

        document.documentElement.lang = L;
        var $ = function (id) { return document.getElementById(id); };
        $('title').textContent = T.title;
        $('lead').textContent = T.lead;
        $('stepsTitle').textContent = T.stepsTitle;
        $('footer').textContent = T.footer;

        var shown = function (raw, ok) { return ok !== null ? ok : raw ? T.invalid : T.none; };
        var rows = [
          [T.account, shown(q.get('poster_url'), account)],
          [T.number, shown(q.get('account_number'), accountNumber)],
          [T.language, shown(q.get('lang'), lang)]
        ];
        var params = $('params');
        rows.forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'row';
          var k = document.createElement('span'); k.className = 'k'; k.textContent = r[0];
          var v = document.createElement('span'); v.className = 'v'; v.textContent = r[1];
          row.appendChild(k); row.appendChild(v); params.appendChild(row);
        });

        var note = $('note');
        if (!sawAny) { note.textContent = T.missing; note.hidden = false; }
        else if (hadCode) { note.textContent = T.codeNote; note.hidden = false; }

        var steps = $('steps');
        var acc = account ? account.replace(/\.joinposter\.com$/i, '') : 'iwyoqar';
        T.steps.forEach(function (s) {
          var li = document.createElement('li');
          li.textContent = s.replace('<account>', acc); // textContent: the (validated) account can never become markup
          steps.appendChild(li);
        });

        // ---- the `code` is not ours to keep: drop it from the address bar (history + Referer hygiene). It is never read, stored or sent. -------------------
        if (hadCode) {
          try { q.delete('code'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : '')); } catch (e) { /* cosmetic */ }
        }

        // ---- Poster's Manage Platform docs: the embedded page removes the preloader itself once it has loaded ---------------------------------------------
        window.addEventListener('load', function () {
          try { top.postMessage({ hideSpinner: true }, '*'); } catch (e) { /* not framed / blocked: nothing to hide */ }
        }, false);
      })();
    </script>
  </body>
</html>
